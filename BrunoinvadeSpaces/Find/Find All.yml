info:
  name: Find All
  type: http
  seq: 2

http:
  method: GET
  url: localhost:8080/spaces
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("reponds with 200 ok", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("returns 3 entities in the response", () => {
          const spaces = res.getBody();
          expect(spaces).to.be.an('array');
          expect(spaces.length).to.equal(3);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
