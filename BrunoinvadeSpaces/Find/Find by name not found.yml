info:
  name: Find by name not found
  type: http
  seq: 3

http:
  method: GET
  url: localhost:8080/spaces/ughregj
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds with 404 not found", () => {
          expect(res.getStatus()).equals(404);
        });

        test("returns null for the space parameter and a proper message", () => {
          const response = res.getBody();
          expect(response.space).to.equal(null);
          expect(response.message).to.equal("No space was found with the given name: ughregj");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
