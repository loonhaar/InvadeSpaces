info:
  name: Find All
  type: http
  seq: 1

http:
  method: GET
  url: localhost:8080/rsvs
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("reponds with 200 ok", () => {
          expect(res.getStatus()).to.equal(200);
        });

        test("returns 100 entities in the response", () => {
          const rsvs = res.getBody();
          expect(rsvs).to.be.an('array');
          expect(rsvs.length).to.equal(100);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
