info:
  name: Add
  type: http
  seq: 5

http:
  method: POST
  url: localhost:8080/spaces
  body:
    type: json
    data: |-
      {
        "name": "Glass",
        "capacity": 24
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("should return 201 Created status", function() {
            expect(res.status).to.equal(201);
        });

        test("should return the created space details", function() {
            const body = res.getBody();

            expect(body).to.have.property("message", "Given space was created");
            expect(body.space).to.have.property("id");
            expect(body.space.Name).to.equal("Glass");
            expect(body.space.Capacity).to.equal(24);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
