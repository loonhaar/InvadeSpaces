info:
  name: Delete ok
  type: http
  seq: 1

http:
  method: DELETE
  url: localhost:8080/spaces/1
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("responds with 200 ok", () => {
          expect(res.getStatus()).equals(200);
        });

        test("returns details about the deleted space", () => {
          const body = res.getBody();
          
          expect(body).to.have.property("message", "Given space was deleted");
          expect(body.space).to.have.property("id");
          expect(body.space.Name).to.equal("Grass");
          expect(body.space.Capacity).to.equal(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false
